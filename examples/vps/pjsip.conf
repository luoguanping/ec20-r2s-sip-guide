[global]
type=global
endpoint_identifier_order=ip,username

[public-tls]
type=transport
protocol=tls
method=tlsv1_2
bind=10.0.0.10:5061
local_net=10.0.0.0/24
external_signaling_address=203.0.113.10
external_signaling_port=5061
external_media_address=203.0.113.10
cert_file=/etc/asterisk/tls/fullchain.pem
priv_key_file=/etc/asterisk/tls/privkey.pem
ca_list_file=/etc/ssl/certs/ca-certificates.crt

[wg-udp]
type=transport
protocol=udp
bind=10.77.38.1:5060

[7001]
type=endpoint
transport=public-tls
context=from-iphone
message_context=from-7001-sms
auth=iphone-auth
aors=7001
disallow=all
allow=alaw,ulaw
direct_media=no
media_address=10.0.0.10
bind_rtp_to_media_address=yes
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733

[iphone-auth]
type=auth
auth_type=userpass
username=7001
password=REPLACE_PUBLIC_SIP_PASSWORD

[7001]
type=aor
max_contacts=1
remove_existing=yes

[r2s]
type=endpoint
transport=wg-udp
context=from-r2s
aors=r2s
identify_by=ip
deny=0.0.0.0/0
permit=10.77.38.2/32
permit=172.30.77.2/32
disallow=all
allow=alaw,ulaw
direct_media=no
media_address=10.77.38.1
bind_rtp_to_media_address=yes
rtp_symmetric=yes
force_rport=yes

[r2s]
type=aor
contact=sip:172.30.77.2:5060
qualify_frequency=30

[r2s-ip]
type=identify
endpoint=r2s
match=10.77.38.2/32
match=172.30.77.2/32

[linphone-incoming]
type=endpoint
transport=public-tls
context=linphone-no-inbound
aors=linphone-incoming
from_domain=sip.example.net
disallow=all
allow=alaw,ulaw
direct_media=no
media_address=10.0.0.10
bind_rtp_to_media_address=yes
rtp_symmetric=yes
force_rport=yes

[linphone-incoming]
type=aor
contact=sip:REPLACE_LINPHONE_USER@sip.linphone.org:5061
