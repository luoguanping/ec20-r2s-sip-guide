[transport-udp]
type=transport
protocol=udp
bind=172.30.77.2:5060
local_net=172.30.77.0/24
local_net=10.77.38.1/32
external_signaling_address=192.168.88.1
external_media_address=192.168.88.1

[1001]
type=endpoint
transport=transport-udp
context=from-local
auth=auth1001
aors=1001
disallow=all
allow=alaw,ulaw
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes

[auth1001]
type=auth
auth_type=userpass
username=1001
password=REPLACE_LOCAL_SIP_PASSWORD

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[vps-sip]
type=endpoint
transport=transport-udp
context=from-vps
aors=vps-sip
identify_by=ip
deny=0.0.0.0/0
permit=10.77.38.1/32
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733

[vps-sip]
type=aor
contact=sip:10.77.38.1:5060
qualify_frequency=30

[vps-sip-ip]
type=identify
endpoint=vps-sip
match=10.77.38.1/32
