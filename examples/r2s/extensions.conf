[general]
static=yes
writeprotect=yes

[from-local]
include => from-vps
exten => 600,1,Goto(from-vps,609,1)

[from-vps]
exten => 609,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; Hong Kong example. For China Telecom install only the intended domestic patterns.
exten => _[235-9]XXXXXXX,1,Set(VOLUME(TX)=1.1)
 same => n,Dial(Quectel/quectel0/${EXTEN},60)
 same => n,Hangup()

[from-cellular]
exten => s,1,Set(VOLUME(RX)=1.1)
 same => n,Dial(PJSIP/1001&PJSIP/7000@vps-sip,45)
 same => n,Hangup()
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)
exten => sms,1,Hangup()
exten => ussd,1,Hangup()
