[general]
interval=15
smsdb=/var/lib/asterisk/smsdb

[defaults]
context=from-cellular
exten=s
group=0
rxgain=0
txgain=0
autodeletesms=no
disablesms=yes
resetquectel=no
u2diag=-1
usecallingpres=yes
callingpres=allowed_passed_screen
callwaiting=no
initstate=start
dtmf=off

[quectel0]
audio=/dev/ttyUSB1
data=/dev/ttyUSB2
quec_uac=1
alsadev=hw:CARD=Android,DEV=0
